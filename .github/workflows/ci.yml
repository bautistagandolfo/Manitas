name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: manitas
          POSTGRES_PASSWORD: manitas
          POSTGRES_DB: manitas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manitas -d manitas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://manitas:manitas@localhost:5432/manitas?schema=public
      FRONTEND_URL: http://localhost:5173
      PORT: 3000
      NODE_ENV: test
      JWT_SECRET: ci-only-not-a-real-secret
      COOKIE_SECRET: ci-only-not-a-real-secret
      LOG_LEVEL: error

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - run: npm run test:integration

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
